<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vienna Ball 2027</title>
<meta name="description" content="Vienna Ball · 8 January 2027 · Student Council">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&display=swap">
<style>
  /* Layout: an engraved invitation opened in a manor at night. A framed, centred card for the hero,
     then a two-column editorial grid (small-caps label left, content right) that stacks on phones. */
  :root {
    --ink: #0b0a0d;          /* night */
    --panel: #141218;        /* lacquered wood */
    --ivory: #f2ecdf;        /* invitation paper */
    --muted: #a69f93;        /* aged ivory */
    --gold: #c6a15b;         /* champagne gold */
    --gold-hi: #e4c88c;
    --rule: rgba(198, 161, 91, .28);
    --display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
    --caps: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.2, .9, .25, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--ink); color: var(--ivory); font: 400 17px/1.65 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---------- background: three photos that crossfade as you scroll ---------- */
  .bgstack { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .bgstack .bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0;
                 will-change: opacity, transform; transform-origin: 50% 40%; }
  .bgstack .bg:first-child { opacity: .55; }      /* visible before the script runs */
  .bgstack::after { content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(80% 55% at 50% 0%, rgba(198, 161, 91, .10), transparent 70%),
      linear-gradient(180deg, rgba(11, 10, 13, .50) 0%, rgba(11, 10, 13, .62) 60%, rgba(11, 10, 13, .72) 100%); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ---------- nav ---------- */
  nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
    background: rgba(11, 10, 13, .7); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    border-bottom: 1px solid var(--rule);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mono { font: 600 15px var(--caps); letter-spacing: .3em; color: var(--gold-hi); text-decoration: none; white-space: nowrap; }
  .navr { display: flex; align-items: center; gap: 10px; }
  .langs { display: flex; padding: 3px; border: 1px solid var(--rule); border-radius: 999px; }
  .langs button { border: 0; background: none; color: var(--muted); font: 600 12px var(--body); letter-spacing: .08em; padding: 6px 10px;
                  border-radius: 999px; cursor: pointer; transition: background .3s var(--ease), color .3s var(--ease); }
  .langs button.on { background: var(--gold); color: var(--ink); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer;
         border-radius: 999px; padding: 14px 26px; font: 600 14px var(--body); letter-spacing: .1em; text-transform: uppercase;
         transition: transform .1s ease-out, background .3s var(--ease), color .3s var(--ease), box-shadow .3s var(--ease); }
  .btn:active { transform: scale(.97); }
  .btn-gold { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #1a1307; box-shadow: 0 8px 30px -10px rgba(198, 161, 91, .6); }
  .btn-gold:hover { box-shadow: 0 10px 36px -8px rgba(228, 200, 140, .75); }
  .btn-line { border: 1px solid var(--rule); color: var(--ivory); }
  .btn-line:hover { border-color: var(--gold); color: var(--gold-hi); }
  nav .btn { padding: 9px 16px; font-size: 12px; }

  /* ---------- hero: the invitation card ---------- */
  .hero { padding-block: clamp(28px, 6vw, 64px) clamp(40px, 8vw, 88px); }
  .card {
    position: relative; text-align: center; padding: clamp(36px, 7vw, 72px) clamp(18px, 5vw, 64px);
    border: 1px solid var(--rule); border-radius: 4px;
    background: linear-gradient(180deg, rgba(20, 18, 24, .58), rgba(11, 10, 13, .42));
    backdrop-filter: blur(8px) saturate(120%); -webkit-backdrop-filter: blur(8px) saturate(120%);
  }
  .card::before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(198, 161, 91, .14); border-radius: 2px; pointer-events: none; }
  .badges { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 22px); margin: 0 auto 28px; }
  .badges img { display: block; width: auto; max-width: 100%; }
  .badges .nis { height: clamp(34px, 6vw, 44px); }
  .badges .sc { height: clamp(40px, 7vw, 52px); }
  .badges .x { font: 400 20px var(--display); color: var(--muted); }
  footer .badges { margin-bottom: 14px; }
  footer .badges .nis { height: 28px; } footer .badges .sc { height: 34px; }
  .crest { width: 92px; height: 92px; margin: 0 auto 22px; display: block; }
  .crest text { font-family: var(--display); }
  .eyebrow { font: 500 12px var(--caps); letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 14px 0 6px; font: 500 clamp(64px, 15vw, 148px)/.9 var(--display); letter-spacing: -.02em; text-wrap: balance; }
  h1 em { font-style: italic; font-weight: 500; display: block;
          background: linear-gradient(100deg, var(--gold) 0%, var(--gold-hi) 35%, #fff6df 50%, var(--gold-hi) 65%, var(--gold) 100%);
          background-size: 250% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent;
          animation: sheen 2.8s var(--ease) .3s 1 both; }
  @keyframes sheen { from { background-position: 100% 0; } to { background-position: 0% 0; } }
  h1 span { font-size: .52em; letter-spacing: .28em; text-transform: uppercase; font-family: var(--caps); font-weight: 500; color: var(--ivory); }
  .divider { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 26px auto; color: var(--gold); max-width: 340px; }
  .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, var(--gold)); }
  .divider::after { transform: scaleX(-1); }
  .when { font: 500 clamp(22px, 4vw, 30px)/1.3 var(--display); }
  .where { color: var(--muted); margin-top: 4px; }

  .countdown { display: flex; justify-content: center; gap: clamp(6px, 3vw, 28px); margin: 32px 0 34px; flex-wrap: wrap; }
  .cd { min-width: 60px; }
  .cd b { display: block; font: 500 clamp(40px, 8vw, 60px)/1 var(--display); font-variant-numeric: tabular-nums lining-nums; color: var(--gold-hi); }
  .cd span { font: 500 11px var(--caps); letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
  .ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ---------- editorial sections ---------- */
  section.block { display: grid; grid-template-columns: 220px 1fr; gap: 24px 48px; padding-block: clamp(44px, 7vw, 76px); border-top: 1px solid var(--rule); }
  .label { font: 500 13px var(--caps); letter-spacing: .28em; text-transform: uppercase; color: var(--gold); padding-top: 12px; }
  .content { min-width: 0; }
  h2 { margin: 0 0 18px; font: 500 clamp(34px, 5.5vw, 52px)/1.05 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  h2 em { color: var(--gold-hi); }
  p { margin: 0 0 14px; max-width: 62ch; color: #ddd6c8; }
  .note { font-size: 14px; color: var(--muted); }
  .ph { color: var(--gold); border-bottom: 1px dashed var(--gold); }   /* placeholder still to fill in */

  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 30px; border-top: 1px solid var(--rule); }
  .fact { padding: 18px 18px 4px 0; }
  .fact + .fact { padding-left: 18px; border-left: 1px solid var(--rule); }
  .fact small { display: block; font: 500 11px var(--caps); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .fact strong { font: 500 22px/1.25 var(--display); color: var(--ivory); }

  .programme { list-style: none; margin: 8px 0 0; padding: 0; }
  .programme li { display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid rgba(198, 161, 91, .14); }
  .programme time { font: 500 24px var(--display); color: var(--gold-hi); font-variant-numeric: tabular-nums lining-nums; }
  .programme span { font: 500 22px/1.3 var(--display); }

  .dress { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  .dress div { padding: 24px; border: 1px solid var(--rule); border-radius: 4px; background: rgba(20, 18, 24, .5);
               backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .dress h3 { margin: 0 0 8px; font: 600 13px var(--caps); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
  .dress p { margin: 0; }

  .steps { list-style: none; counter-reset: s; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 32px; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 44px 1fr; gap: 14px; }
  .steps li::before { content: counter(s, upper-roman); font: 500 15px var(--caps); color: var(--gold-hi); width: 44px; height: 44px; display: grid; place-items: center;
                      border: 1px solid var(--gold); border-radius: 50%; }
  .steps h3 { margin: 6px 0 4px; font: 600 22px/1.25 var(--display); }
  .steps p { margin: 0; font-size: 15px; color: var(--muted); }
  .partner { margin-top: 30px; padding: 18px 22px; border-left: 2px solid var(--gold); background: rgba(198, 161, 91, .07); }
  .partner p { margin: 0; color: var(--ivory); }

  details { border-bottom: 1px solid rgba(198, 161, 91, .14); }
  summary { cursor: pointer; list-style: none; padding: 18px 36px 18px 0; position: relative; font: 500 22px/1.3 var(--display); }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; position: absolute; right: 4px; top: 14px; font: 400 28px var(--display); color: var(--gold); transition: transform .35s var(--ease); }
  details[open] summary::after { transform: rotate(45deg); }
  details p { padding-bottom: 16px; }

  footer { border-top: 1px solid var(--rule); padding-block: 36px calc(36px + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--muted); font-size: 14px; }
  footer .mono { display: inline-block; margin-bottom: 10px; }

  @media (max-width: 820px) {
    section.block { grid-template-columns: 1fr; gap: 10px; }
    .label { padding-top: 0; }
    .facts { grid-template-columns: 1fr 1fr; }
    .fact:nth-child(3) { padding-left: 0; border-left: 0; }
    .fact:nth-child(n+3) { border-top: 1px solid var(--rule); }
    .steps, .dress { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) {
    nav .btn { display: none; }
    .programme li { grid-template-columns: 70px 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    h1 em { animation: none; background-position: 50% 0; }
    .btn, .langs button, summary::after { transition: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    nav { background: var(--ink); backdrop-filter: none; -webkit-backdrop-filter: none; }
    .card, .dress div { background: var(--panel); backdrop-filter: none; -webkit-backdrop-filter: none; }
    .bgstack::after { background: rgba(11, 10, 13, .82); }
  }
</style>
</head>

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const browser = (navigator.language || '').slice(0, 2);
  let lang = store.get('vb_site_lang') || (browser === 'kk' ? 'kk' : browser === 'en' ? 'en' : 'ru');

  function applyLang() {
    document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = I[lang][el.dataset.i]; });
    document.querySelectorAll('[data-l]').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
    document.documentElement.lang = lang;
  }
  document.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.l; store.set('vb_site_lang', lang); applyLang(); }));

  if (FORM_URL) document.querySelectorAll('.js-register').forEach(a => { a.href = FORM_URL; a.target = '_blank'; a.rel = 'noopener'; });

  const target = new Date(BALL_START).getTime();
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    const m = Math.floor(s / 60); s %= 60;
    document.getElementById('cdD').textContent = d;
    document.getElementById('cdH').textContent = pad(h);
    document.getElementById('cdM').textContent = pad(m);
    document.getElementById('cdS').textContent = pad(s);
  }

  // Background crossfade: waltz at the top → manor from the programme → chandelier from the tickets.
  // Each photo holds for most of its stretch and blends into the next over the last part of it.
  const layers = [...document.querySelectorAll('.bgstack .bg')];
  const anchors = ['programme', 'tickets'].map(id => document.getElementById(id));
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const MAX_OPACITY = 0.55;                                     // "medium-low": the photo never fully dominates
  let stops = [], queued = false;
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  function measure() { stops = [0, ...anchors.map(el => el.getBoundingClientRect().top + scrollY)]; paintBg(); }
  function paintBg() {
    queued = false;
    const y = scrollY + innerHeight * 0.45;
    let f = stops.length - 1;
    for (let k = 0; k < stops.length - 1; k++) {
      if (y < stops[k + 1]) { f = k + smooth(0.5, 1, (y - stops[k]) / (stops[k + 1] - stops[k])); break; }
    }
    layers.forEach((l, i) => {
      const w = Math.max(0, 1 - Math.abs(f - i));
      l.style.opacity = (w * MAX_OPACITY).toFixed(3);
      l.style.transform = still.matches ? 'none' : 'scale(' + (1.06 - 0.06 * w).toFixed(4) + ')';   // arriving photo settles in
    });
  }
  addEventListener('scroll', () => { if (!queued) { queued = true; requestAnimationFrame(paintBg); } }, { passive: true });
  addEventListener('resize', measure);
  addEventListener('load', measure);

  applyLang();
  tick();
  setInterval(tick, 1000);
  measure();
</script>
